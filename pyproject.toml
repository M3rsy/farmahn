[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farmahn"
version = "0.1.0"
description = "CLI/TUI ligero para comparar precios de medicamentos en farmacias de Honduras"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "FarmaHN"}]
dependencies = [
  "typer>=0.12.5",
  "rich>=13.9.0",
  "httpx>=0.27.2",
  "beautifulsoup4>=4.12.3",
  "pydantic>=2.9.2",
  "rapidfuzz>=3.9.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3", "pytest-asyncio>=0.24.0"]

[project.scripts]
farmahn = "farmahn.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
