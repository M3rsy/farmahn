[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farmahn"
version = "0.3.1"
description = "CLI para comparar precios y disponibilidad de medicamentos en farmacias de Honduras"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "FarmaHN"}]
dependencies = [
  "typer>=0.12.5",
  "rich>=13.9.0",
  "httpx>=0.27.2",
  "beautifulsoup4>=4.12.3",
  "pydantic>=2.9.2",
  "rapidfuzz>=3.9.7",
  "playwright>=1.47.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
]

[project.scripts]
farmahn = "farmahn.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
